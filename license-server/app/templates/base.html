<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Licenças SIS DG{% endblock %}</title>
  <style>
    :root {
      --fg: #1a2a38;
      --muted: #5a6a7a;
      --accent: #103055;
      --bg: #f4f6f8;
      --card: #ffffff;
      --border: #d8dee6;
      --danger: #9b1c1c;
      --ok: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }
    header {
      background: var(--accent);
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge-active { background: #dcfce7; color: var(--ok); }
    .badge-suspended { background: #fee2e2; color: var(--danger); }
    .badge-expired { background: #f3f4f6; color: var(--muted); }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    input, select {
      width: 100%;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 0.85rem;
      font: inherit;
    }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 180px; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    button, .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-secondary { background: #4b5563; }
    .btn-danger { background: var(--danger); }
    .flash { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
    .flash-ok { background: #dcfce7; color: var(--ok); }
    .flash-err { background: #fee2e2; color: var(--danger); }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; word-break: break-all; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .key-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin: 0.25rem 0 0.85rem;
    }
    .key-row code {
      flex: 1;
      min-width: 12rem;
      padding: 0.45rem 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .key-row .btn-copy { flex-shrink: 0; }
  </style>
</head>
<body>
  <header>
    <a href="/admin">SIS DG — Licenças</a>
    <a href="/admin/new">Nova clínica</a>
  </header>
  <main>
    {% if flash %}
    <div class="flash flash-{{ flash.kind }}">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
